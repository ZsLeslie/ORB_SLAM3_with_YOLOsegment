%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV) 
Camera1.fx: 535.4
Camera1.fy: 539.2
Camera1.cx: 320.1
Camera1.cy: 247.6

Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 640
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0
Stereo.b: 0.0747

# Depth map values factor
RGBD.DepthMapFactor: 5000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0


# Adaptive static features (RGB-D only; independent opt-in switches).
# Enable FAST, Quota and Feedback together to use the complete mechanism.
AdaptiveFeatures.FAST: 1
AdaptiveFeatures.Quota: 1
AdaptiveFeatures.Feedback: 1
AdaptiveFeatures.Stats: 0
AdaptiveFeatures.MinStaticPerCell: 5
AdaptiveFeatures.MaxFeatures: 2000
AdaptiveFeatures.DynamicAlpha: 1.0
AdaptiveFeatures.FeedbackFastGain: 2.0
AdaptiveFeatures.FeedbackQuotaGain: 0.5
AdaptiveFeatures.LowInliers: 60
AdaptiveFeatures.HighInliers: 100
AdaptiveFeatures.RiseStep: 0.25
AdaptiveFeatures.DecayStep: 0.10

# RGB-D optical flow motion classification. Defaults match the original implementation.
# 1: classify person motion; 0: filter all YOLO persons without optical flow
OpticalFlow.Enabled: 1
# Maximum background Shi-Tomasi corners
OpticalFlow.BackgroundMaxCorners: 600
# Corner quality relative to the strongest corner
OpticalFlow.BackgroundQualityLevel: 0.01
# Minimum background corner spacing in pixels
OpticalFlow.BackgroundMinDistance: 12.0
# Odd corner detection block size
OpticalFlow.BackgroundBlockSize: 3
# Minimum valid background tracks for affine estimation
OpticalFlow.MinBackgroundTracks: 40
# Minimum valid person tracks for residual classification
OpticalFlow.MinPersonTracks: 8
# Person mask sampling stride in pixels
OpticalFlow.PersonSampleStep: 8
# Odd LK tracking window size
OpticalFlow.LKWindowSize: 21
# Maximum LK pyramid level; 0 uses the original image only
OpticalFlow.LKMaxLevel: 3
# LK termination iteration limit
OpticalFlow.LKMaxIterations: 30
# LK termination displacement tolerance
OpticalFlow.LKEpsilon: 0.01
# LK minimum eigenvalue threshold
OpticalFlow.LKMinEigenThreshold: 0.0001
# Partial affine RANSAC reprojection threshold in pixels
OpticalFlow.RansacReprojThreshold: 3.0
# RANSAC iteration limit
OpticalFlow.RansacMaxIterations: 2000
# RANSAC confidence, strictly between 0 and 1
OpticalFlow.RansacConfidence: 0.99
# Affine refinement iterations; 0 disables refinement
OpticalFlow.RansacRefineIterations: 10
# Person match distance relative to current bbox maximum dimension
OpticalFlow.MatchMaxCenterDistRatio: 0.75
# Low IoU and excessive center distance reject a person match
OpticalFlow.MatchMinIoU: 0.02
# Person match score = center distance - weight * IoU
OpticalFlow.MatchIoUWeight: 80.0
# Motion-compensated person flow residual threshold in pixels
OpticalFlow.MovingResidualPx: 3.0
# Fraction of person tracks above the residual threshold
OpticalFlow.MovingResidualRatio: 0.25
# Motion-compensated bbox center displacement threshold in pixels
OpticalFlow.MovingCenterResidualPx: 6.0
# Maximum missing-person frames for affine mask propagation; 0 disables it
OpticalFlow.CloudMaskMaxMissFrames: 2
